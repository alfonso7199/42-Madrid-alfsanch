; Pool de php-fpm para WordPress
[www]
user  = www-data
group = www-data

; Escuchamos en TCP (no socket Unix) porque nginx está en otro contenedor
listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data

; Gestión dinámica de procesos
pm                   = dynamic
pm.max_children      = 5
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Permitir que php-fpm pase las variables de entorno al proceso PHP
clear_env = no

; Redirigir access log a stdout → visible con "docker logs wordpress"
access.log = /proc/self/fd/1

; Redirigir error log a stderr → visible con "docker logs wordpress"
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Capturar la salida de los workers en los logs del proceso principal
catch_workers_output = yes
