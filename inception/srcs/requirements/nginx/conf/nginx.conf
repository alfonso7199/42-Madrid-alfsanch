# Declaramos los bloques explícitos events{} y http{} para tener control total
# sobre la configuración (el nginx.conf por defecto de Debian ya los declara,
# pero lo sobreescribimos para que nuestro archivo sea autocontenido).

events {}

http {
    # Redirigimos access y error logs a stdout/stderr → visibles con "docker logs nginx"
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        server_name alfsanch.42.fr;

        # Certificado autofirmado generado en el build
        ssl_certificate     /etc/ssl/certs/inception.crt;
        ssl_certificate_key /etc/ssl/private/inception.key;

        # El subject solo permite TLSv1.2 y TLSv1.3
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_timeout 10m;
        keepalive_timeout   70;

        root  /var/www/html;
        index index.php index.html;

        # try_files garantiza que los permalinks de WordPress funcionen:
        # primero busca el archivo exacto, luego el directorio, y si no existe
        # redirige a index.php (que enruta WordPress internamente)
        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Pasa los archivos .php a php-fpm (contenedor wordpress, puerto 9000)
        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass            wordpress:9000;
            fastcgi_index           index.php;
            include                 fastcgi_params;
            fastcgi_param           SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param           PATH_INFO $fastcgi_path_info;
        }

        # Bloquea el acceso a archivos .htaccess
        location ~ /\.ht {
            deny all;
        }
    }
}
